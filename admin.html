<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>База знаний</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell"><header><div><p class="eyebrow">Настройки</p><h1>База знаний эксперта</h1></div><a href="/">К диалогу</a></header><section class="card"><label>Пароль администратора<input id="password" type="password" placeholder="admin123"></label><label>Файлы PDF, DOCX, TXT, MD, CSV или JSON<input id="files" type="file" multiple accept=".pdf,.docx,.txt,.md,.csv,.json"></label><button id="upload">Загрузить</button><p id="status"></p></section><section><h2>Загруженные материалы</h2><div id="docs" class="list"><p>Введите пароль, чтобы увидеть файлы.</p></div></section></main><script>const p=document.querySelector('#password'),d=document.querySelector('#docs'),s=document.querySelector('#status');async function load(){const r=await fetch('/api/admin',{headers:{'X-Admin-Password':p.value}}),v=await r.json();if(!r.ok){d.textContent=v.error;return}d.innerHTML=v.documents.length?'':'<p>Файлов пока нет.</p>';v.documents.forEach(x=>{const el=document.createElement('div');el.className='card row';el.innerHTML=`<span><strong>${x.name}</strong><br><small>${x.characters} знаков</small></span><button class="secondary">Удалить</button>`;el.querySelector('button').onclick=async()=>{await fetch('/api/admin/document/'+x.id,{method:'DELETE',headers:{'X-Admin-Password':p.value}});load()};d.append(el)})}p.onchange=load;document.querySelector('#upload').onclick=async()=>{const files=document.querySelector('#files').files;if(!files.length)return;s.textContent='Загрузка…';const f=new FormData();[...files].forEach(x=>f.append('files',x));const r=await fetch('/api/admin/upload',{method:'POST',headers:{'X-Admin-Password':p.value},body:f}),v=await r.json();s.textContent=r.ok?'Материалы загружены':v.error;if(r.ok)load()};</script></body></html>
