<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Консультация</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell"><header><div><p class="eyebrow">Консультация</p><h1>Диалог с экспертом</h1><p>Расскажите о своей ситуации или задайте вопрос.</p></div><a href="/admin">База знаний</a></header><section id="chat" class="chat" aria-live="polite"><div class="bubble bot">Здравствуйте! Расскажите, пожалуйста, что вас сейчас беспокоит и с чем вы хотели бы разобраться?</div></section><form id="form"><input id="message" autocomplete="off" placeholder="Напишите сообщение…"><button>Отправить</button></form><button id="reset" class="secondary">Начать заново</button></main><script>const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#message');function add(t,c){const d=document.createElement('div');d.className='bubble '+c;d.textContent=t;chat.append(d);chat.scrollTop=chat.scrollHeight}form.onsubmit=async e=>{e.preventDefault();const m=input.value.trim();if(!m)return;add(m,'user');input.value='';input.disabled=true;const wait=document.createElement('div');wait.className='bubble bot';wait.textContent='…';chat.append(wait);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});const v=await r.json();wait.textContent=v.answer||v.error}catch{wait.textContent='Не удалось получить ответ. Попробуйте ещё раз.'}input.disabled=false;input.focus()};document.querySelector('#reset').onclick=async()=>{await fetch('/api/reset',{method:'POST'});location.reload()}</script></body></html>
